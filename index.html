<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Aperture</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d0d0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aperture">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- Top bar -->
  <header class="topbar">
    <div class="brand"><span class="mark"></span>Aperture</div>
    <div class="hist-wrap">
      <button id="btnUndo" class="icon-btn" disabled aria-label="Atsaukt">↶</button>
      <button id="btnRedo" class="icon-btn" disabled aria-label="Atkārtot">↷</button>
    </div>
    <div class="topbar-actions">
      <button id="btnCompare" class="icon-btn" aria-label="Salīdzināt">◑</button>
      <button id="btnExport" class="icon-btn primary" aria-label="Eksportēt">Saglabāt</button>
    </div>
  </header>

  <!-- Viewer -->
  <main class="stage" id="stage">
    <div class="viewer" id="viewer">
      <canvas id="glCanvas"></canvas>
      <div id="cropOverlay" class="crop-overlay hidden">
        <div class="crop-box" id="cropBox">
          <span class="ch tl"></span><span class="ch tr"></span>
          <span class="ch bl"></span><span class="ch br"></span>
        </div>
      </div>
    </div>

    <div id="emptyState" class="empty-state">
      <div class="empty-ring"></div>
      <h1>Aperture</h1>
      <p>RAW &amp; foto redaktors — viss notiek tavā ierīcē</p>
      <label class="cta">
        Atvērt attēlu
        <input type="file" id="fileInput" accept="image/*,.cr2,.cr3,.nef,.arw,.dng,.raf,.orf,.rw2,.pef" hidden>
      </label>
      <span class="formats">RAW · DNG · JPEG · HEIC · PNG</span>
    </div>

    <div id="loadToast" class="load-toast hidden"><span class="spin"></span><span id="loadMsg">Ielādē…</span></div>
    <div id="note" class="note hidden"></div>

    <!-- Histogram floating -->
    <canvas id="histCanvas" class="histogram hidden"></canvas>
  </main>

  <!-- Tool rail -->
  <nav class="tool-rail" id="toolRail">
    <button class="tool active" data-tool="light"><span class="ti">◗</span>Gaisma</button>
    <button class="tool" data-tool="color"><span class="ti">◎</span>Krāsa</button>
    <button class="tool" data-tool="curve"><span class="ti">∿</span>Līknes</button>
    <button class="tool" data-tool="hsl"><span class="ti">◍</span>HSL</button>
    <button class="tool" data-tool="grade"><span class="ti">◐</span>Grading</button>
    <button class="tool" data-tool="detail"><span class="ti">◇</span>Detaļas</button>
    <button class="tool" data-tool="effects"><span class="ti">✶</span>Efekti</button>
    <button class="tool" data-tool="geometry"><span class="ti">⛶</span>Kadrs</button>
    <button class="tool" data-tool="presets"><span class="ti">≡</span>Preseti</button>
  </nav>

  <!-- Panels -->
  <section class="dock" id="dock">
    <div class="panel" data-panel="light"></div>
    <div class="panel hidden" data-panel="color"></div>

    <div class="panel hidden" data-panel="curve">
      <div class="curve-tabs">
        <button class="ctab active" data-ch="curveLuma">RGB</button>
        <button class="ctab" data-ch="curveR">R</button>
        <button class="ctab" data-ch="curveG">G</button>
        <button class="ctab" data-ch="curveB">B</button>
      </div>
      <canvas id="curveCanvas" class="curve-canvas"></canvas>
      <p class="hint">Pieskaries, lai pievienotu punktu · dubultklikšķis, lai dzēstu</p>
    </div>

    <div class="panel hidden" data-panel="hsl">
      <div class="hsl-band-tabs" id="hslBandTabs"></div>
      <div class="hsl-sliders" id="hslSliders"></div>
    </div>

    <div class="panel hidden" data-panel="grade">
      <div class="wheels">
        <div class="wheel-item"><canvas class="wheel" data-wheel="gradeShadow"></canvas><span>Ēnas</span></div>
        <div class="wheel-item"><canvas class="wheel" data-wheel="gradeMid"></canvas><span>Vidustoņi</span></div>
        <div class="wheel-item"><canvas class="wheel" data-wheel="gradeHigh"></canvas><span>Gaišie</span></div>
      </div>
      <div id="gradeBlendSlider"></div>
    </div>

    <div class="panel hidden" data-panel="detail"></div>
    <div class="panel hidden" data-panel="effects"></div>

    <div class="panel hidden" data-panel="geometry">
      <div class="geo-row">
        <button class="geo-btn" data-geo="rotL">↺ 90°</button>
        <button class="geo-btn" data-geo="rotR">↻ 90°</button>
        <button class="geo-btn" data-geo="flipH">⇋ H</button>
        <button class="geo-btn" data-geo="flipV">⇅ V</button>
      </div>
      <div id="straightenSlider"></div>
      <div class="geo-row">
        <button class="geo-btn wide" id="cropToggle">Apgriezt (crop)</button>
        <button class="geo-btn wide" id="cropReset">Atiestatīt kadru</button>
      </div>
    </div>

    <div class="panel hidden" data-panel="presets">
      <div class="preset-save">
        <input type="text" id="presetName" placeholder="Jauns preset nosaukums">
        <button id="btnSavePreset">+</button>
      </div>
      <div class="preset-list" id="presetList"></div>
      <div class="preset-io">
        <button id="btnExportPresets">Eksportēt presetus</button>
        <label class="preset-import">Importēt<input type="file" id="importPresets" accept=".json" hidden></label>
      </div>
    </div>
  </section>

</div>
<script type="module" src="app.js"></script>
</body>
</html>
